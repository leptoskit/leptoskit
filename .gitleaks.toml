# gitleaks runs its default rules here, plus the allowlist below for the
# false positives this repository is known to contain.

[extend]
useDefault = true

[[allowlists]]
description = "CocoaPods lockfiles list a SHA-1 checksum for every pod spec, which the generic-api-key rule reads as a key"
paths = ['''(^|/)Podfile\.lock$''']

[[allowlists]]
description = "A throwaway RSA key the IdP tests sign RS256 ID tokens with; it signs nothing outside the test suite"
paths = ['''^crates/leptoskit_idp/tests/fixtures/test-only-[a-z-]+\.pem$''']

[[allowlists]]
description = "The local audit acceptance ledger quotes git SHAs, thread ids, and acceptance prose, which the generic-api-key entropy rule misreads; it records no credentials"
paths = ['''^\.audit/deep-audit-[0-9]{4}-[0-9]{2}-[0-9]{2}/acceptance-ledger\.json$''']
