# gitleaks runs its default rules here, plus the allowlist below for the
# false positives this repository is known to contain.

[extend]
useDefault = true

[[allowlists]]
description = "CocoaPods lockfiles list a SHA-1 checksum for every pod spec, which the generic-api-key rule reads as a key"
paths = ['''(^|/)Podfile\.lock$''']

[[allowlists]]
description = "A throwaway RSA key the IdP tests sign RS256 ID tokens with; it signs nothing outside the test suite"
paths = ['''^crates/leptoskit_idp/tests/fixtures/test-only-[a-z-]+\.pem$''']

[[allowlists]]
description = "A throwaway RSA key the notifications tests sign RS256 service-account assertions with; it signs nothing outside the test suite"
paths = ['''^crates/leptoskit_notifications/tests/fixtures/test-only-rsa-key\.pem$''']

[[allowlists]]
description = "The manifests' snapshots encode a fake secret value into a test Secret's base64 data; the value unlocks nothing outside the test suite"
paths = ['''^crates/leptoskit_cloud_runtime/tests/snapshots/[^/]+\.snap$''']
