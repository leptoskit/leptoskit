[workspace]

[package]
name = "migration-window-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
leptoskit_db = { path = "../../../crates/leptoskit_db", features = ["postgres"] }
leptoskit_db_schema = { path = "../../../crates/leptoskit_db_schema" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
expanded = []

[profile.release]
opt-level = 0
debug = 0
incremental = false
