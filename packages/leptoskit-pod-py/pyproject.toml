[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leptoskit_pod"
version = "0.3.0"
description = "LK Pod — portable little-endian TLV codec for leptoskit RPC"
readme = "readme.md"
license = "Unlicense"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["leptoskit_pod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
