[package]
name = "leptoskit_plugin_app_integrity"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Platform app attestation tokens for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "app-integrity"
apple-module = "LeptosKitAppIntegrity"
