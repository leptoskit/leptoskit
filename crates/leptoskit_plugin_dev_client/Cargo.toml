[package]
name = "leptoskit_plugin_dev_client"
version = "0.3.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Connect a phone to the guest leptoskit dev is serving."

[package.metadata.leptoskit.runtime]
name = "dev-client"
apple-module = "LeptosKitDevClient"
apple-type = "DevClientPlugin"
apple-context = true
android-type = "dev.leptoskit.plugins.devclient.DevClientPlugin"
android-context = true
android-dependencies = ["com.journeyapps:zxing-android-embedded:4.3.0"]

[package.metadata.leptoskit.runtime.harmonyos]
unavailable = true

[package.metadata.leptoskit.runtime.windows]
unavailable = true

[package.metadata.leptoskit.runtime.linux]
unavailable = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[lints]
workspace = true
