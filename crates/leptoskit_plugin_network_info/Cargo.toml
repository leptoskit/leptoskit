[package]
name = "leptoskit_plugin_network_info"
version = "0.3.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Wi-Fi name, BSSID, and local address details for LeptosKit, returning nothing the platform withholds."

[package.metadata.leptoskit.runtime]
name = "network-info"
apple-module = "LeptosKitNetworkInfo"
apple-type = "NetworkInfoPlugin"
android-type = "dev.leptoskit.plugins.networkinfo.NetworkInfoPlugin"
android-context = true
android-permissions = ["android.permission.ACCESS_NETWORK_STATE", "android.permission.ACCESS_WIFI_STATE"]

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
if-addrs = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
