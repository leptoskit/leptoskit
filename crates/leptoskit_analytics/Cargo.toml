[package]
name = "leptoskit_analytics"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Product analytics for LeptosKit apps: a service with its own database, and the batch format its clients send."

# The service itself. `lk` builds it with the `service` feature.
[[bin]]
name = "leptoskit_analytics"
path = "src/main.rs"
required-features = ["service"]

# The service's tests need its bodies.
[[test]]
name = "service"
required-features = ["service"]

# Typed events, derived.
[[test]]
name = "event"
required-features = ["derive"]

# The server's client, sending to the service.
[[test]]
name = "client"
required-features = ["service", "server-client"]

[dependencies]
# Everything below is the service's, or the server client's. The library
# without features (the client core and the batch format) depends on
# nothing, so an app that captures events doesn't compile any of it;
# `tests/dependencies.rs` keeps it that way.
chrono = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
leptoskit_analytics_macros = { workspace = true, optional = true }
leptoskit_axum = { workspace = true, optional = true }
leptoskit_db = { workspace = true, optional = true }
leptoskit_rpc = { workspace = true, optional = true, features = ["client"] }
reqwest = { workspace = true, optional = true, features = ["rustls-tls"] }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }
uuid = { workspace = true, optional = true, features = ["serde", "v4"] }

# The browser's transport (`web`): only what a leptoskit web app already
# compiles.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The native app's transport (`native`): the plugins a native leptoskit app
# already has.
any_spawner = { workspace = true, optional = true }
leptoskit_bridge = { workspace = true, optional = true, features = ["guest"] }
leptoskit_plugin_crypto = { workspace = true, optional = true, features = ["guest"] }
leptoskit_plugin_filesystem = { workspace = true, optional = true, features = ["guest"] }
leptoskit_plugin_http = { workspace = true, optional = true, features = ["guest"] }
leptoskit_query = { workspace = true, optional = true, features = ["guest"] }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Crypto", "Document", "Headers", "Location", "Navigator", "RequestInit", "Response", "Screen", "Storage", "VisibilityState", "Window"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
flate2 = { workspace = true }
insta = { workspace = true }
# What `leptoskit_apm`'s exporter sends, for the OTLP route's end-to-end test.
leptoskit_apm = { workspace = true, features = ["server"] }
proptest = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
trybuild = { workspace = true }

[features]
default = []
# Building the service: ingestion, storage, and the binary. Only `lk` turns
# this on, when it builds the service; the app never does.
service = [
	"dep:chrono",
	"dep:flate2",
	"dep:leptoskit_axum",
	"dep:leptoskit_db",
	"dep:leptoskit_rpc",
	"dep:schemars",
	"dep:serde",
	"dep:serde_json",
	"dep:sha2",
	"dep:tokio",
	"dep:uuid",
	"leptoskit_db/sqlite",
	"leptoskit_rpc/server",
	"leptoskit_rpc/sqlite",
]
# `#[derive(Event)]`, for typed events. A proc macro: it adds nothing to
# an app's bundle.
derive = ["dep:leptoskit_analytics_macros"]
# The client for the app's server: `client::server::Analytics`, sending in
# the background with Tokio.
server-client = ["dep:reqwest", "dep:tokio", "tokio/macros"]
# The client in the browser: `client::web`, sending with `fetch` and
# `sendBeacon`. Only on `wasm32-unknown-unknown`.
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
# The client in a native app's Wasm guest: `client::native`, sending
# through the HTTP plugin and keeping unsent events in the app's files.
native = [
	"dep:any_spawner",
	"dep:leptoskit_bridge",
	"dep:leptoskit_plugin_crypto",
	"dep:leptoskit_plugin_filesystem",
	"dep:leptoskit_plugin_http",
	"dep:leptoskit_query",
]
# The same service on Postgres, for an app whose `[db]` is Postgres.
postgres = ["service", "leptoskit_db/postgres", "leptoskit_rpc/postgres"]

# What `lk` reads to run this crate as a service.
[package.metadata.leptoskit.service]
name = "analytics"
port = 3110
public = true
features = ["service"]
database = true

[lints]
workspace = true
