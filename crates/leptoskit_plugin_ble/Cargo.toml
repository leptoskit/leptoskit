[package]
name = "leptoskit_plugin_ble"
version = "0.3.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Bluetooth Low Energy GATT central scanning, subscriptions, and standard wearable sensor decoders (heart rate, RR-intervals/HRV, SpO2, temperature, cadence, cycling power)."

[package.metadata.leptoskit.runtime]
name = "ble"
apple-module = "LeptosKitBle"
apple-type = "BlePlugin"
apple-usage-descriptions = ["NSBluetoothAlwaysUsageDescription"]
android-type = "dev.leptoskit.plugins.ble.BlePlugin"
android-context = true
android-permissions = [
	"android.permission.BLUETOOTH_SCAN",
	"android.permission.BLUETOOTH_CONNECT",
]
harmonyos-type = "BlePlugin"
harmonyos-context = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[lints]
workspace = true
