[package]
name = "leptoskit_plugin_sharing"
version = "0.3.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Text, web URL and file sharing through the user-selected native share UI, with the chosen destination where the platform reports it."

[package.metadata.leptoskit.runtime]
name = "sharing"
apple-module = "LeptosKitSharing"
apple-type = "SharingPlugin"
apple-context = true
android-type = "dev.leptoskit.plugins.sharing.SharingPlugin"
android-context = true
# FileProvider and the chooser's chosen-component callback.
android-dependencies = ["androidx.core:core:1.16.0"]
# Serves only the private share cache the plugin copies shared files into.
android-file-providers = [
	{ class = "dev.leptoskit.plugins.sharing.SharingFileProvider", authority-suffix = "leptoskit.sharing", paths = "leptoskit_sharing_paths" },
]

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }
url = "2"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
futures = { workspace = true }
js-sys = "0.3"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Blob", "DomException", "File", "FilePropertyBag", "Navigator", "Window"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
