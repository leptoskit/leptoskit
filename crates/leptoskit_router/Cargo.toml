[package]
name = "leptoskit_router"
version = "0.3.1"
authors.workspace = true
categories = ["web-programming", "gui"]
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "router", "routes", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Typed file routes for leptoskit: the runtime behind the generated `Route` enum."

[dependencies]
leptoskit_native = { workspace = true }
leptoskit_router_macros = { workspace = true }
reactive_graph = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
leptos_router = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Document", "Element", "EventTarget", "History", "Location", "Node", "PopStateEvent", "Url", "Window"] }

[features]
default = []
# Keep the browser's address bar, back button and history in step with the
# router. Only takes effect in wasm builds that run in a browser.
web = ["dep:send_wrapper", "dep:wasm-bindgen", "dep:web-sys"]
# Register file routes with `leptos_axum` and read the request URL on the server.
# Only takes effect on native targets, even when features unify in a web build.
ssr = ["dep:leptos", "dep:leptos_axum", "dep:leptos_router"]

[dev-dependencies]
leptoskit_yoga = { workspace = true }

[lints]
workspace = true
