[package]
name = "leptoskit_plugin_asset"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Packaged asset name resolution for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "asset"
apple-module = "LeptosKitAsset"
apple-type = "AssetPlugin"
apple-context = true
android-type = "dev.leptoskit.plugins.asset.AssetPlugin"
android-context = true

[package.metadata.leptoskit.runtime.harmonyos]
unavailable = true

[package.metadata.leptoskit.runtime.windows]
unavailable = true

[package.metadata.leptoskit.runtime.linux]
unavailable = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[lints]
workspace = true
