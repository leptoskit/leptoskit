[package]
name = "leptoskit_plugin_image_picker"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Bounded photo-library image and video picking with temporary URI ownership for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "image-picker"
apple-module = "LeptosKitImagePicker"
apple-type = "ImagePickerPlugin"
apple-context = true
android-type = "dev.leptoskit.plugins.imagepicker.ImagePickerPlugin"
android-context = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
futures = { workspace = true }
js-sys = "0.3"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Window", "Document", "HtmlInputElement", "HtmlElement", "HtmlImageElement", "Element", "Node", "Event", "EventTarget", "File", "FileList", "FilePropertyBag", "Blob", "Url", "DomException"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
