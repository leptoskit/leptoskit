[package]
name = "leptoskit_plugin_contacts"
version = "0.3.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Bounded contact permission, pick-one, and query for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "contacts"
apple-module = "LeptosKitContacts"
apple-type = "ContactsPlugin"
apple-context = true
apple-usage-descriptions = ["NSContactsUsageDescription"]
android-type = "dev.leptoskit.plugins.contacts.ContactsPlugin"
android-context = true
android-permissions = ["android.permission.READ_CONTACTS"]

[package.metadata.leptoskit.runtime.windows]
unavailable = true

[package.metadata.leptoskit.runtime.linux]
unavailable = true

[package.metadata.leptoskit.runtime.tui]
unavailable = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[lints]
workspace = true
