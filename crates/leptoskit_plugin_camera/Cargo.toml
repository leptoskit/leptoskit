[package]
name = "leptoskit_plugin_camera"
version = "0.3.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Host-owned camera sessions with a Camera preview surface for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "camera"
apple-module = "LeptosKitCamera"
apple-type = "CameraPlugin"
apple-context = true
android-type = "dev.leptoskit.plugins.camera.CameraPlugin"
android-context = true
android-permissions = ["android.permission.CAMERA"]
android-dependencies = [
	"androidx.camera:camera-camera2:1.4.1",
	"androidx.camera:camera-lifecycle:1.4.1",
	"androidx.camera:camera-view:1.4.1",
]

[package.metadata.leptoskit.runtime.harmonyos]
unavailable = true

[package.metadata.leptoskit.runtime.windows]
unavailable = true

[package.metadata.leptoskit.runtime.linux]
unavailable = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "HtmlMediaElement", "HtmlVideoElement", "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack", "Navigator", "Node", "NodeList", "Url", "Window"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
