[package]
name = "leptoskit_plugin_shell"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Scoped, bounded, cancellable desktop child processes for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "shell"
rust-factory = "from_config"
rust-async = true
# `leptoskit build` refuses an app whose options leave these out, which the
# factory would reject at launch. `host::desktop` tests hold the factory to
# the list.
required-options = ["commands"]

# Phones have no processes to start: the factory there always fails, which
# would stop the app at launch, so the build leaves the plugin out.
[package.metadata.leptoskit.runtime.ios]
unavailable = true

[package.metadata.leptoskit.runtime.android]
unavailable = true

[package.metadata.leptoskit.runtime.harmonyos]
unavailable = true

[features]
guest = ["leptoskit_bridge/guest"]
async-host = ["leptoskit_bridge/async-host", "dep:serde", "dep:serde_json"]

[dependencies]
leptoskit_bridge.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "macos", all(target_os = "linux", not(target_env = "ohos")), target_os = "windows"))'.dependencies]
regex.workspace = true
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }
tokio = { workspace = true, features = ["process", "io-util", "time", "rt", "sync", "macros", "signal"] }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "time"] }
toml = { workspace = true }

[target.'cfg(any(target_os = "macos", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true
