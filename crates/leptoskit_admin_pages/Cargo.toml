[package]
name = "leptoskit_admin_pages"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The leptoskit admin's pages: rendered by `leptoskit_admin` on the server and hydrated in the browser from the same component trees."

# One crate is both sides. `leptoskit_admin` links the library with `ssr` and
# renders every page from it; `leptoskit build` compiles the same library to
# Wasm with `hydrate`, and the browser picks the page up where the server
# left it. The admin itself is a server and never builds for Wasm, which is
# why the pages live here and not inside it.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The browser's task executor, started before the page runs a request.
any_spawner = { workspace = true, optional = true, features = ["wasm-bindgen"] }
# The analytics area's dates and times.
chrono = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
futures = { workspace = true }
leptos = { workspace = true }
# `apm`: the fleet's measurements, which Health draws.
leptoskit = { workspace = true, features = ["apm", "aria", "auth", "query", "rpc", "web"] }
# The insights engine's types: a query, and what it answered.
leptoskit_analytics = { workspace = true, features = ["insights"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
# The theme's cookie, the device's appearance, saving a preference, and a
# full page load when a search result leads to another page.
web-sys = { workspace = true, optional = true, features = ["Crypto", "Document", "Element", "Headers", "History", "HtmlDocument", "HtmlElement", "Location", "MediaQueryList", "Node", "Performance", "Request", "RequestCredentials", "RequestInit", "Response", "Window"] }

# Copy in a drawer, through the browser's clipboard. It has no other
# backend here, so the dependency is the browser's alone.
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptoskit_plugin_clipboard = { workspace = true, optional = true }

[features]
default = []
# The server: renders the pages, and runs the streams' bodies.
ssr = ["leptos/ssr", "leptoskit/db-sqlite", "leptoskit/rpc-live-streams", "leptoskit/ssr"]
# The browser: hydrates the page the server rendered.
hydrate = [
	"dep:any_spawner",
	"dep:console_error_panic_hook",
	"dep:leptoskit_plugin_clipboard",
	"dep:wasm-bindgen",
	"dep:wasm-bindgen-futures",
	"dep:web-sys",
	"leptos/hydrate",
	"leptoskit/hydrate",
]

[lints]
workspace = true
