[package]
name = "leptoskit_plugin_cellular"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Carrier, MCC/MNC, radio generation, and VoIP capability snapshots for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "cellular"
apple-module = "LeptosKitCellular"
apple-type = "CellularPlugin"
android-type = "dev.leptoskit.plugins.cellular.CellularPlugin"
android-context = true

# Desktops have no cellular radio; the adapter answers Unavailable fields.
[package.metadata.leptoskit.runtime.linux]
rust-type = "desktop::Cellular"

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
