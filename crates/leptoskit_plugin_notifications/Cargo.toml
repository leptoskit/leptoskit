[package]
name = "leptoskit_plugin_notifications"
version = "0.3.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Immediate local system notifications for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "notifications"
apple-module = "LeptosKitNotifications"
apple-type = "NotificationsPlugin"
android-type = "dev.leptoskit.plugins.notifications.NotificationsPlugin"
android-context = true
android-permissions = ["android.permission.POST_NOTIFICATIONS"]
extension-permissions = ["notifications"]

[features]
default = ["browser"]
# The browser implementation: the `Notification` API in a web build. Off
# for interpreter guests, whose tree must stay free of browser imports —
# the same split as the HTTP plugin's.
browser = [
	"dep:js-sys",
	"dep:wasm-bindgen",
	"dep:wasm-bindgen-futures",
	"dep:web-sys",
]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
dbus = { version = "0.9.12", features = ["vendored"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { workspace = true, optional = true, features = ["Notification", "NotificationOptions", "NotificationPermission", "DomException", "Window"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[dev-dependencies]
libtest-mimic = { workspace = true }

[[test]]
name = "linux_notify"
harness = false

[lints]
workspace = true
