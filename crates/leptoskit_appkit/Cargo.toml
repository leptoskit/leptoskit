[package]
name = "leptoskit_appkit"
version = "0.3.1"
authors.workspace = true
categories = ["gui", "os::macos-apis", "rendering"]
edition.workspace = true
homepage.workspace = true
keywords = ["appkit", "macos", "native", "renderer", "leptos"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The leptoskit AppKit backend: renders leptoskit element trees as real macOS views."

[target.'cfg(target_os = "macos")'.dependencies]
leptoskit_native = { workspace = true }
leptoskit_yoga = { workspace = true }
thiserror = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-text", "objc2-quartz-core", "NSAccessibilityConstants", "NSAccessibilityProtocols", "NSActionCell", "NSApplication", "NSAppearance", "NSAttributedString", "NSBitmapImageRep", "NSButton", "NSButtonCell", "NSCell", "NSClipView", "NSColor", "NSColorSpace", "NSControl", "NSEvent", "NSFont", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSImageView", "NSPanel", "NSParagraphStyle", "NSPopover", "NSProgressIndicator", "NSResponder", "NSRunningApplication", "NSScrollView", "NSSecureTextField", "NSSlider", "NSSwitch", "NSStringDrawing", "NSText", "NSTextContainer", "NSTextContent", "NSTextField", "NSTextFieldCell", "NSTextView", "NSView", "NSViewController", "NSWindow", "block2"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFArray", "CFCGTypes", "CFNumber", "CFURL"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGColor", "CGDirectDisplay", "CGPath"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont", "CTFontDescriptor", "CTFontManager"] }
objc2-foundation = { workspace = true, features = ["std", "objc2-core-foundation", "NSArray", "NSAttributedString", "NSData", "NSEnumerator", "NSDictionary", "NSGeometry", "NSValue", "NSNotification", "NSObject", "NSString"] }
objc2-quartz-core = { workspace = true, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CAShapeLayer", "CATransaction"] }

[dev-dependencies]
leptoskit_testing = { workspace = true }
libtest-mimic = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
leptoskit_native = { workspace = true, features = ["rive"] }
leptoskit_rive = { workspace = true }
objc2-app-kit = { workspace = true, features = ["std", "NSAccessibilityProtocols", "NSAccessibilityConstants", "NSScreen", "NSScroller", "NSTextContent", "NSTextField"] }
objc2-foundation = { workspace = true, features = ["std", "NSGeometry"] }

[lints]
workspace = true
