[package]
name = "leptoskit_plugin_maps"
version = "0.3.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Host-owned map sessions with a Map surface for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "maps"
apple-module = "LeptosKitMaps"
apple-type = "MapsPlugin"
apple-context = true
android-type = "dev.leptoskit.plugins.maps.MapsPlugin"
android-context = true
android-dependencies = ["com.google.android.gms:play-services-maps:19.0.0"]

[package.metadata.leptoskit.runtime.harmonyos]
unavailable = true

[package.metadata.leptoskit.runtime.windows]
unavailable = true

[package.metadata.leptoskit.runtime.linux]
unavailable = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[lints]
workspace = true
