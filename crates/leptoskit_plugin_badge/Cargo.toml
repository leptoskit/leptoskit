[package]
name = "leptoskit_plugin_badge"
version = "0.3.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "App icon badge counts for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "badge"
apple-module = "LeptosKitBadge"
apple-type = "BadgePlugin"
android-type = "dev.leptoskit.plugins.badge.BadgePlugin"
android-context = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
dbus = { version = "0.9.12", features = ["vendored"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Window", "Navigator", "DomException"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
