[package]
name = "leptoskit_plugin_wearable"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Direct on-watch live and passive biometric sensors for Wear OS (including Samsung Galaxy Watch), watchOS, and HarmonyOS wearables."

[package.metadata.leptoskit.runtime]
name = "wearable"
apple-module = "LeptosKitWearable"
apple-type = "WearablePlugin"
apple-usage-descriptions = ["NSHealthShareUsageDescription", "NSMotionUsageDescription"]
apple-entitlements = ["com.apple.developer.healthkit"]
android-type = "dev.leptoskit.plugins.wearable.WearablePlugin"
android-context = true
android-dependencies = ["androidx.health:health-services-client:1.1.0-alpha05"]
android-permissions = [
	"android.permission.ACTIVITY_RECOGNITION",
	"android.permission.BODY_SENSORS",
	"android.permission.BODY_SENSORS_BACKGROUND",
]
harmonyos-type = "WearablePlugin"
harmonyos-context = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[lints]
workspace = true
