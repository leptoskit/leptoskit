[package]
name = "leptoskit_wasm"
version = "0.3.0"
authors.workspace = true
categories = ["wasm", "gui"]
edition.workspace = true
homepage.workspace = true
keywords = ["wasm", "leptos", "native"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The on-device wasm runtime host that runs the leptoskit app bundle against a native backend."

[dependencies]
leptoskit_bridge = { workspace = true }
leptoskit_log = { workspace = true }
leptoskit_native = { workspace = true, features = ["serde"] }
leptoskit_rive = { workspace = true, features = ["serde"] }
leptoskit_yoga = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
wasmi = { workspace = true }
wasmi_core = { workspace = true }

[dev-dependencies]
# The native analytics client's guest acceptance (`tests/analytics_guest.rs`):
# the batch format, and the HTTP and filesystem plugins' wire formats.
leptoskit_analytics = { workspace = true }
leptoskit_log = { workspace = true, features = ["testing"] }
leptoskit_plugin_filesystem = { workspace = true }
leptoskit_plugin_http = { workspace = true }
wasmi = { workspace = true, features = ["wat"] }

[features]
rive = ["leptoskit_native/rive"]

[lints]
workspace = true
