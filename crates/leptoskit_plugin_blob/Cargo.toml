[package]
name = "leptoskit_plugin_blob"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Owned bounded byte blobs for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "blob"
apple-module = "LeptosKitBlob"
apple-type = "BlobPlugin"
apple-context = true
android-type = "dev.leptoskit.plugins.blob.BlobPlugin"
android-context = true

[package.metadata.leptoskit.runtime.harmonyos]
unavailable = true

[package.metadata.leptoskit.runtime.windows]
rust-type = "Blob"

[package.metadata.leptoskit.runtime.linux]
rust-type = "Blob"

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[lints]
workspace = true
