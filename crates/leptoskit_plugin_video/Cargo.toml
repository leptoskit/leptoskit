[package]
name = "leptoskit_plugin_video"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Host-owned URL video players with a Video surface for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "video"
apple-module = "LeptosKitVideo"
apple-type = "VideoPlugin"
android-type = "dev.leptoskit.plugins.video.VideoPlugin"
android-context = true
android-dependencies = [
	"androidx.media3:media3-exoplayer:1.5.1",
	"androidx.media3:media3-ui:1.5.1",
]

[package.metadata.leptoskit.runtime.harmonyos]
unavailable = true

[package.metadata.leptoskit.runtime.windows]
unavailable = true

[package.metadata.leptoskit.runtime.linux]
unavailable = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
futures = { workspace = true }
gloo-events = "0.2"
js-sys = "0.3"
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement", "HtmlMediaElement", "HtmlVideoElement", "MediaError", "Node", "Window"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
