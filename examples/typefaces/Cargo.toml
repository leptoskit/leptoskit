[package]
name = "typefaces_example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Typefaces, an app's own fonts drawn on every platform: the worked example for `[theme.fonts]`."

# The example is a standalone workspace, like the projects `leptoskit new`
# scaffolds, so its native runners build only through `leptoskit build`, which
# generates `.leptoskit/` before their registrant sources compile.
[workspace]
members = ["android", "ios", "macos"]
resolver = "2"

# Dependencies on this repository's crates travel by path, and everything else
# matches the versions the repository itself pins.
[workspace.dependencies]
leptos = { version = "0.9.0-rc0", default-features = false }
leptoskit = { path = "../../crates/leptoskit" }
wasm-bindgen = "0.2"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Run in a browser: the leptos web renderer.
leptos = { workspace = true, features = ["csr"], optional = true }
leptoskit = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
default = []
web = ["dep:leptos", "dep:wasm-bindgen", "leptoskit/web"]
# Run as a native Wasm guest: one platform feature per destination, exactly as
# `leptoskit build --platform <platform>` enables it.
native = ["leptoskit/guest"]
ios = ["native", "leptoskit/ios"]
android = ["native", "leptoskit/android"]
macos = ["native", "leptoskit/macos"]

# The page test installs the fonts as a host does and lays the page out.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptoskit_native = { path = "../../crates/leptoskit_native", features = ["serde"] }
leptoskit_yoga = { path = "../../crates/leptoskit_yoga" }

[lints]
workspace = true

[workspace.lints.rust]
# Group lints
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

# Individual lints
unsafe_code = "deny"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
# Group lints
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Individual lints
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
tabs_in_doc_comments = "allow"
too_many_lines = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"
