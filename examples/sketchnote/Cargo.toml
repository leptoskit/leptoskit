[package]
name = "sketchnote_example"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Sketchnote, a notebook page where drawings sit in the flow of the text: the worked example for the canvist editor."

# The library is also the browser's Wasm client, which `leptoskit dev` and
# `leptoskit build` build with `csr`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { workspace = true, features = ["csr"], optional = true }
leptoskit = { workspace = true }
# The editor. `ink` adds drawings to it; without the feature an editor
# carries no code for them.
leptoskit_canvist = { workspace = true, features = ["ink"] }
# The status line counts what the page holds from the JSON the editor saves.
serde_json = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
leptoskit_testing = { workspace = true }
reactive_graph = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["CanvasRenderingContext2d", "Document", "DomRect", "Element", "HtmlCanvasElement", "HtmlElement", "ImageData", "MouseEvent", "Node", "PointerEvent", "PointerEventInit", "Window"] }

[features]
# The browser: leptos renders the screen, and the editor draws itself in its
# `CanvistEditor` element.
web = ["dep:leptos", "dep:wasm-bindgen-futures", "leptoskit/web", "leptoskit_canvist/web"]
# Mount the notebook when the browser loads the Wasm client.
csr = ["web", "dep:wasm-bindgen"]

[lints]
workspace = true
