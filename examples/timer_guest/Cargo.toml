[package]
name = "timer_guest_probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# The guest compiles only for wasm32; the host build is an empty crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
any_spawner = { workspace = true }
futures = { workspace = true, features = ["executor"] }
reactive_graph = { workspace = true }
leptoskit_bridge = { workspace = true, features = ["guest"] }
leptoskit_query = { workspace = true, default-features = false, features = ["guest"] }

[lints]
workspace = true
