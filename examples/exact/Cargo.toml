[package]
name = "exact_examples"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "The Exact showcase apps, rebuilt as leptoskit screens."

# The library is also the browser client `leptoskit dev` builds with `csr`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { workspace = true, features = ["csr"], optional = true }
leptoskit = { workspace = true, features = ["virtual"] }
leptoskit_testing = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Location", "Window"] }

[features]
web = ["dep:leptos", "leptoskit/web"]
csr = ["web", "dep:wasm-bindgen", "dep:web-sys"]

[dev-dependencies]
reactive_graph = { workspace = true }

[lints]
workspace = true
