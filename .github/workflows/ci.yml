name: ci

# Linux only. Toolchain, caches, and Cargo tools are installed directly.
# Nix and devenv stay on developer machines.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_BUILD_JOBS: "4"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust
        uses: ./.github/actions/rust

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: fmt
          cache-on-failure: false

      - name: check formatting
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          cargo run --locked --package leptoskit_fmt --features cli --bin leptoskit-fmt -- \
            --toolchain "$toolchain" \
            --exclude '**/fixtures/**' \
            --exclude '**/snapshots/**' \
            --exclude 'benchmarks/apps/**' \
            --exclude '**/tests/ui/**' \
            --check

  lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install zizmor
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: zizmor@1.32.0

      - name: audit GitHub Actions workflows
        run: zizmor --no-online-audits --no-progress .github

  build:
    name: clippy, build, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Clippy and the unit tests share one target directory. Incremental
      # compilation lets the tests reuse the dependencies clippy just built.
      CARGO_INCREMENTAL: "1"
      # Bindgen needs clang on PATH, but the C++ sources (Rive) must use g++.
      # An explicit target triple makes clang miss libstdc++ headers.
      CC: gcc
      CXX: g++
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake clang libclang-dev \
            libgtk-4-dev libasound2-dev

      - name: install rust
        uses: ./.github/actions/rust

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: linux-build
          cache-on-failure: false

      - name: build and clippy
        shell: bash
        run: |
          set -euo pipefail
          # Default members are the crates. Clippy compiles those libraries and
          # binaries with every feature, and denies rustc, clippy, and cargo warnings.
          cargo clippy --locked --all-features --keep-going --config 'build.warnings="deny"'

      - name: unit tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib \
            --package leptoskit_yoga \
            --package leptoskit_native \
            --package leptoskit_config \
            --package leptoskit_watch \
            --package leptoskit_watchos \
            --package leptoskit_wearos \
            --package leptoskit_platform_harmonyos \
            --package leptoskit_plugin_wearable \
            --package leptoskit_plugin_watch_sync \
            --package leptoskit_plugin_ble \
            --package leptoskit_plugin_health

      - name: check generated configuration schemas
        shell: bash
        run: cargo run --locked --package leptoskit_config --features schema --example schema -- --check

      - name: check standalone lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            benchmarks/arena/apps/leptoskit/Cargo.toml \
            crates/leptoskit_cli/tests/fixtures/app-service/Cargo.toml \
            devtools/Cargo.toml \
            examples/commonplace/Cargo.toml \
            examples/dev_client/Cargo.toml \
            examples/file_routes/Cargo.toml \
            examples/huddle/linux/Cargo.toml; do
            cargo metadata --locked --format-version 1 --manifest-path "$manifest" > /dev/null
          done

      - name: check workspace examples and docs played web builds
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace --keep-going \
            --exclude huddle_ios \
            --exclude huddle_macos
          for pkg in gallery observatory_example postcard_example; do
            cargo check --locked --target wasm32-unknown-unknown \
              --package "$pkg" --lib --features web
          done
          cargo check --locked --manifest-path examples/file_routes/Cargo.toml \
            --target wasm32-unknown-unknown --lib --features web
