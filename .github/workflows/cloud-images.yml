name: cloud container images

on:
  push:
    branches: [main]
    paths:
      - "crates/leptoskit_cloud/**"
      - "crates/leptoskit_cloud_app/**"
      - "crates/leptoskit_cloud_runtime/**"
      - "crates/leptoskit_cloud_worker/**"
      - "crates/leptoskit_config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/cloud-images.yml"
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated OCI target platforms
        required: false
        default: "linux/amd64,linux/arm64"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: leptoskit-cloud-control
            dockerfile: crates/leptoskit_cloud_app/Dockerfile
            target: runtime
          - name: leptoskit-cloud-worker
            dockerfile: crates/leptoskit_cloud_worker/Dockerfile
            target: cluster
          - name: leptoskit-cloud-builder
            dockerfile: crates/leptoskit_cloud_worker/Dockerfile
            target: builder
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: build and push multi-arch OCI image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
          PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io || true' EXIT

          docker run --privileged --rm tonistiigi/binfmt --install arm64 >/dev/null
          docker buildx create --name leptoskit-cloud --driver docker-container --use >/dev/null

          tags=("--tag" "${image}:${GITHUB_SHA}")
          if [ "${GITHUB_REF_NAME:-}" = "main" ]; then
            tags+=("--tag" "${image}:main")
          fi

          docker buildx build \
            --platform "${PLATFORMS}" \
            --file "${DOCKERFILE}" \
            --target "${TARGET}" \
            --cache-from "type=registry,ref=${image}:buildcache" \
            --cache-to "type=registry,ref=${image}:buildcache,mode=max" \
            --metadata-file metadata.json \
            --push \
            "${tags[@]}" \
            .

          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          printf '%s@%s\n' "${image}" "${digest}" > "${IMAGE_NAME}.digest.txt"
          grep -Eq '@sha256:[a-f0-9]{64}$' "${IMAGE_NAME}.digest.txt"
          cat "${IMAGE_NAME}.digest.txt"

      - name: upload immutable digest pin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}-digest
          path: ${{ matrix.name }}.digest.txt
