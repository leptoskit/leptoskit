name: benchmarks

# On-demand comparison against the vendored frameworks. Pull requests do not
# measure it. Refresh the committed tables locally with
# `devenv shell -- benchmark:docs`.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CC: gcc
  CXX: g++

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external:
    name: external comparison
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust
        uses: ./.github/actions/rust

      - name: install deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8

      - name: install cargo-binstall
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-binstall

      - name: install cargo-leptos
        run: cargo binstall --no-confirm --disable-strategies compile cargo-leptos@0.3.6 || cargo install cargo-leptos --version 0.3.6 --locked

      - name: install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake clang libclang-dev \
            libgtk-4-dev libasound2-dev

      - name: install binaryen and esbuild
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz \
            -o "$archive"
          echo "195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"
          archive="$RUNNER_TEMP/esbuild.tgz"
          curl --fail --silent --show-error --location --retry 3 \
            https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.27.2.tgz \
            -o "$archive"
          echo "4ac0a36a8573ef6b612263661e7c77343a38789485344e1875cf33a498292310  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/esbuild"
          tar -xzf "$archive" -C "$RUNNER_TEMP/esbuild"
          echo "$RUNNER_TEMP/esbuild/package/bin" >> "$GITHUB_PATH"

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: bench-external
          workspaces: |
            .
            benchmarks/apps/runtime/leptoskit
            benchmarks/apps/build/cargo-leptos

      - name: build the leptoskit cli
        run: cargo build --release --locked --package leptoskit_cli --bin leptoskit

      - name: run the external benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/benchmarks
          deno run -A benchmarks/scripts/external.ts \
            --cli "$PWD/target/release/leptoskit" \
            --runtime-out target/benchmarks/external-runtime.json \
            --build-out target/benchmarks/external-build.json \
            --skip-flutter
          deno run -A benchmarks/scripts/native_bench.ts \
            --out target/benchmarks/native-host.json --subject native-host

      - name: upload external benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-benchmark-results
          path: target/benchmarks/
          retention-days: 90
          if-no-files-found: ignore
