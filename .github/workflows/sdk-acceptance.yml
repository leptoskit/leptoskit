name: SDK acceptance

on:
  workflow_call:
    inputs:
      revision:
        description: Exact checkout revision, or the caller's commit when empty
        type: string
        default: ""

permissions:
  contents: read

jobs:
  sdk:
    name: all generated clients
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ github.token }}
          nix-cache: /tmp/nixcache
          install-tools: "false"

      - uses: ./.github/actions/rust

      - name: exercise every generated SDK
        run: test:sdk
