tag = true
release = true
# `primary` means one tag names the whole group. A tag per crate would
# make the releases page unreadable and give nothing extra, since the group is
# always released together.
version_format = "primary"

# The workspace version moves with the group, so a released tag describes a
# repository whose manifests agree with it.
versioned_files = [
	{ path = "Cargo.toml", type = "cargo", fields = ["workspace.package.version"] },
	# The apps built the way `leptoskit new --sdk-path` scaffolds them pin each
	# SDK crate to exactly the CLI's version, so a release that left them behind
	# would leave them unable to resolve the crates they sit beside.
	{ path = "examples/file_routes/**/Cargo.toml", regex = 'leptoskit\w* = \{ version = "=(?<version>\d+\.\d+\.\d+)"' },
	{ path = "examples/commonplace/**/Cargo.toml", regex = 'leptoskit\w* = \{ version = "=(?<version>\d+\.\d+\.\d+)"' },
	{ path = "examples/huddle/linux/Cargo.toml", regex = 'leptoskit\w* = \{ version = "=(?<version>\d+\.\d+\.\d+)"' },
	# The DevTools interface is versioned with the CLI that downloads it.
	{ path = "devtools/Cargo.toml", regex = 'leptoskit\w* = \{ version = "=(?<version>\d+\.\d+\.\d+)"' },
	{ path = "benchmarks/arena/apps/leptoskit/**/Cargo.toml", regex = 'leptoskit\w* = \{ version = "=(?<version>\d+\.\d+\.\d+)"' },
]

# One changelog at the root, listing every package. Each package's own
# changelog.md is still written by `[defaults.changelog]`; this is the
# human-readable summary of what went into a release.
[group.release.changelog]
path = "changelog.md"
format = "monochange"
include = "all"

# The built-in types cover features, fixes, and the rest, but a performance
# change has no type of its own: it patches like a fix, and it reads as its own
# entry under Performance rather than being filed under Fixes.
[changelog.types]
perf = { bump = "patch", section = "perf", description = "A faster path with no behaviour change" }

